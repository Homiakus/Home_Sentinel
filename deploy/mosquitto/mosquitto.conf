# Home Sentinel production Mosquitto baseline.
# Passwords are generated at deployment time; no credentials belong in Git.
persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/runtime/passwords
acl_file /mosquitto/config/acl.conf

# Keep protocol limits finite so one client cannot exhaust the broker.
max_packet_size 1048576
max_queued_messages 1000
message_size_limit 1048576
