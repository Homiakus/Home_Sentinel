# Sentinel control plane owns sentinel/* and HA discovery publishing.
user sentinel
topic readwrite sentinel/#
topic read frigate/#
topic write homeassistant/#

# Frigate owns only its own namespace. It may receive command topics under it.
user frigate
topic readwrite frigate/#

# Home Assistant consumes Sentinel/Frigate state and owns its discovery/state namespace.
user homeassistant
topic read frigate/#
topic read sentinel/#
topic readwrite homeassistant/#

# Intercoms are provisioned with a per-device ACL file fragment generated from
# deploy/mosquitto/intercom-acl.template; never grant a generic intercom user sentinel/#.
