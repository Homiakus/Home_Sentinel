name: stage17-runtime-hardening-bootstrap

on:
  push:
    branches:
      - stage17-incident-runtime-wiring

permissions:
  contents: write

jobs:
  harden-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: stage17-incident-runtime-wiring
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .go-version
          cache: true
      - name: Add exact critical mutation surface
        shell: python
        run: |
          from pathlib import Path
          p = Path('internal/engloop/model.go')
          text = p.read_text()
          needle = '''\t\t"internal/telegram/notifier",\n\t)'''
          replacement = '''\t\t"internal/telegram/notifier",\n\t\t// The application incident runtime owns durable orchestration lifecycle\n\t\t// and callback authority; mutations here can change fail-closed behavior.\n\t\t"internal/app/incident_runtime",\n\t)'''
          if text.count(needle) != 1:
              raise SystemExit('critical surface anchor mismatch')
          p.write_text(text.replace(needle, replacement))
      - name: Format
        run: gofmt -w internal/app/incident_runtime.go internal/app/incident_runtime_test.go internal/app/incident_runtime_state_test.go internal/engloop/model.go internal/engloop/incident_runtime_surface_test.go
      - name: Target tests
        run: go test ./internal/app ./internal/engloop ./internal/telegram ./internal/orchestration/incident -count=1
      - name: Target race
        run: go test -race ./internal/app ./internal/engloop ./internal/telegram ./internal/orchestration/incident -count=1
      - name: Verify gate planning
        run: |
          printf '%s\n' internal/app/incident_runtime.go > /tmp/runtime-changed.txt
          go run ./cmd/sentinel-engloop gates --changed-file /tmp/runtime-changed.txt | tee /tmp/runtime-gates.json
          test "$(jq -r '.risk' /tmp/runtime-gates.json)" = CRITICAL
          test "$(jq -r '.mutation_targets[0]' /tmp/runtime-gates.json)" = ./internal/app
      - name: Commit verified hardening and remove bootstrap
        run: |
          set -euo pipefail
          rm .github/workflows/stage17-runtime-hardening-bootstrap.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/app/incident_runtime.go internal/app/incident_runtime_test.go internal/app/incident_runtime_state_test.go internal/engloop/model.go internal/engloop/incident_runtime_surface_test.go .github/workflows/stage17-runtime-hardening-bootstrap.yml
          git commit -m "test(stage17): harden incident runtime lifecycle gates"
          git push origin HEAD:stage17-incident-runtime-wiring
