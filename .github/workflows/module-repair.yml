name: module-repair

on:
  push:
    paths:
      - '.github/workflows/module-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup exact Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
          cache: false

      - name: Regenerate and verify module checksums
        shell: bash
        run: |
          set -euo pipefail
          rm -f go.sum
          go mod tidy
          go mod verify
          go list ./... >/dev/null
          git diff --exit-code -- go.mod
          test -s go.sum

      - name: Commit verified checksum repair and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.sum
          git rm .github/workflows/module-repair.yml
          git diff --cached --check
          git commit -m 'build: regenerate verified Go module checksums'
          git push origin HEAD:main
