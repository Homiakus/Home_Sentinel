name: mutation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  critical-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Determine diff and engineering gates
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="origin/${{ github.base_ref }}"
            git diff --name-only "${base}...HEAD" > /tmp/engloop-changed.txt
            echo "range_mode=pull-request" >> "$GITHUB_OUTPUT"
          elif [[ -f docs/engineering/ACTIVE_WORK_PACKET.json ]]; then
            go run ./cmd/sentinel-engloop active-packet --root . --json > /tmp/engloop-active-packet.json
            cat /tmp/engloop-active-packet.json
            base="$(jq -r '.mutation_base' /tmp/engloop-active-packet.json)"
            max_commits="$(jq -r '.max_commits' /tmp/engloop-active-packet.json)"
            git cat-file -e "${base}^{commit}" || {
              echo "active mutation base does not resolve to a commit: ${base}" >&2
              exit 20
            }
            git merge-base --is-ancestor "$base" HEAD || {
              echo "active mutation base is not an ancestor of HEAD: ${base}" >&2
              exit 21
            }
            commit_count="$(git rev-list --count "${base}..HEAD")"
            if (( commit_count < 1 || commit_count > max_commits )); then
              echo "active packet commit range ${commit_count} is outside [1, ${max_commits}]" >&2
              exit 22
            fi
            git diff --name-only "$base" HEAD > /tmp/engloop-changed.txt
            echo "range_mode=active-work-packet" >> "$GITHUB_OUTPUT"
            echo "commit_count=${commit_count}" >> "$GITHUB_OUTPUT"
          else
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              base="HEAD^"
              git diff --name-only HEAD^ HEAD > /tmp/engloop-changed.txt
            else
              base="$(git rev-list --max-parents=0 HEAD)"
              git ls-files > /tmp/engloop-changed.txt
            fi
            echo "range_mode=single-commit-fallback" >> "$GITHUB_OUTPUT"
          fi

          if [[ ! -s /tmp/engloop-changed.txt ]]; then
            echo '{"risk":"LOW","gates":["static","unit"],"mutation_targets":[]}' > /tmp/engloop-gates.json
          else
            go run ./cmd/sentinel-engloop gates --changed-file /tmp/engloop-changed.txt > /tmp/engloop-gates.json
          fi
          cat /tmp/engloop-gates.json

          risk="$(jq -r '.risk' /tmp/engloop-gates.json)"
          targets="$(jq -r '.mutation_targets | length' /tmp/engloop-gates.json)"
          echo "risk=${risk}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          if [[ "$targets" -gt 0 ]]; then
            echo "mutation=true" >> "$GITHUB_OUTPUT"
          else
            echo "mutation=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Critical diff mutation testing
        if: steps.plan.outputs.mutation == 'true'
        env:
          BASE: ${{ steps.plan.outputs.base }}
        run: make mutation-diff BASE="$BASE"

      - name: Upload mutation evidence
        if: always() && steps.plan.outputs.mutation == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gremlins-${{ github.sha }}
          path: .artifacts/gremlins.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
