name: gofmt-repair

on:
  push:
    paths:
      - '.github/workflows/gofmt-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup exact Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
          cache: true

      - name: Apply deterministic gofmt only
        shell: bash
        run: |
          set -euo pipefail
          before_non_go="$(git status --porcelain --untracked-files=no | awk '{print $2}' | grep -vE '\.go$' || true)"
          test -z "$before_non_go"

          find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 gofmt -w

          remaining="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          test -z "$remaining"
          git diff --check

          changed_non_go="$(git diff --name-only | grep -vE '\.go$' || true)"
          test -z "$changed_non_go" || (echo "unexpected non-Go changes:" && echo "$changed_non_go" && exit 1)

      - name: Commit formatting repair and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.go' ':!vendor/**'
          git rm .github/workflows/gofmt-repair.yml
          git diff --cached --check
          git commit -m 'style: normalize Go formatting'
          git push origin HEAD:main
