name: module-reconcile

on:
  push:
    paths:
      - '.github/workflows/module-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
          cache: false

      - name: Canonicalize module metadata
        run: |
          set -euo pipefail
          go mod tidy
          go mod verify
          go list ./... >/dev/null
          echo '--- go.mod diff ---'
          git diff -- go.mod
          echo '--- module status ---'
          git status --short -- go.mod go.sum

      - name: Upload canonical module metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-module-metadata-${{ github.sha }}
          path: |
            go.mod
            go.sum
          if-no-files-found: error
          retention-days: 2
