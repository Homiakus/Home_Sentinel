name: stage17-runtime-test-gofmt

on:
  push:
    branches: [stage17-app-runtime-wiring]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: stage17-app-runtime-wiring
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .go-version
          cache: true
      - name: Format exact test file and verify
        run: |
          set -euo pipefail
          gofmt -w internal/app/incident_runtime_test.go internal/app/incident_runtime.go
          test -z "$(gofmt -l internal/app/incident_runtime_test.go internal/app/incident_runtime.go)"
          go test ./internal/app -count=1
          go test -race ./internal/app -count=1
          git diff --check
      - name: Commit mechanical formatting and remove bootstrap
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/stage17-runtime-test-gofmt.yml
          git add internal/app/incident_runtime_test.go internal/app/incident_runtime.go .github/workflows/stage17-runtime-test-gofmt.yml
          git commit -m 'style(stage17): normalize incident runtime lifecycle tests'
          git push origin HEAD:stage17-app-runtime-wiring
