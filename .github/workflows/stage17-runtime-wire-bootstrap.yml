name: stage17-runtime-wire-bootstrap

on:
  push:
    branches:
      - stage17-incident-runtime-wiring

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: stage17-incident-runtime-wiring
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .go-version
          cache: true
      - name: Apply exact integration patch
        shell: python
        run: |
          from pathlib import Path

          app = Path('internal/app/app.go')
          text = app.read_text()
          needle = '\tTelegram               *tgsvc.Service\n\tMetrics                *telemetry.Metrics\n'
          replacement = '\tTelegram               *tgsvc.Service\n\tIncidentRuntime        *IncidentRuntime\n\tMetrics                *telemetry.Metrics\n'
          if text.count(needle) != 1:
              raise SystemExit('App field anchor mismatch')
          text = text.replace(needle, replacement)

          needle = '''\t\tif err := a.Telegram.Start(a.runCtx); err != nil {\n\t\t\t_ = a.Close()\n\t\t\treturn nil, fmt.Errorf("start Telegram service: %w", err)\n\t\t}\n\t}\n\ta.startWatchdog()'''
          replacement = '''\t\tif err := a.Telegram.Start(a.runCtx); err != nil {\n\t\t\t_ = a.Close()\n\t\t\treturn nil, fmt.Errorf("start Telegram service: %w", err)\n\t\t}\n\t}\n\tif err := a.startIncidentRuntime(); err != nil {\n\t\t_ = a.Close()\n\t\treturn nil, err\n\t}\n\ta.startWatchdog()'''
          if text.count(needle) != 1:
              raise SystemExit('Incident runtime startup anchor mismatch')
          text = text.replace(needle, replacement)

          needle = '''\tif a.Watchdog != nil {\n\t\ta.Watchdog.Close()\n\t\ta.Watchdog = nil\n\t}\n\tif a.Incidents != nil {'''
          replacement = '''\tif a.Watchdog != nil {\n\t\ta.Watchdog.Close()\n\t\ta.Watchdog = nil\n\t}\n\tif a.IncidentRuntime != nil {\n\t\tif err := a.IncidentRuntime.Close(); err != nil && first == nil {\n\t\t\tfirst = err\n\t\t}\n\t\ta.IncidentRuntime = nil\n\t}\n\tif a.Incidents != nil {'''
          if text.count(needle) != 1:
              raise SystemExit('Incident runtime shutdown anchor mismatch')
          text = text.replace(needle, replacement)
          app.write_text(text)

          runtime = Path('internal/app/incident_runtime.go')
          text = runtime.read_text()
          needle = '''\tmu       sync.RWMutex\n\tserveErr error\n\tcloseOnce sync.Once'''
          replacement = '''\tmu        sync.RWMutex\n\tserveErr  error\n\tclosed    bool\n\tcloseOnce sync.Once'''
          if text.count(needle) != 1:
              raise SystemExit('Incident runtime state anchor mismatch')
          text = text.replace(needle, replacement)

          needle = '''\tr.mu.RLock()\n\terr := r.serveErr\n\tr.mu.RUnlock()\n\tif err != nil {'''
          replacement = '''\tr.mu.RLock()\n\terr := r.serveErr\n\tclosed := r.closed\n\tr.mu.RUnlock()\n\tif closed {\n\t\treturn ErrIncidentRuntimeUnavailable\n\t}\n\tif err != nil {'''
          if text.count(needle) != 1:
              raise SystemExit('Incident operational anchor mismatch')
          text = text.replace(needle, replacement)

          needle = '''\tr.closeOnce.Do(func() {\n\t\tif r.cancel != nil {'''
          replacement = '''\tr.closeOnce.Do(func() {\n\t\tr.mu.Lock()\n\t\tr.closed = true\n\t\tr.mu.Unlock()\n\t\tif r.cancel != nil {'''
          if text.count(needle) != 1:
              raise SystemExit('Incident close anchor mismatch')
          text = text.replace(needle, replacement)

          needle = '''\tif !a.Config.Telegram.Enabled {\n\t\tif a.Config.Security.Callbacks.Enabled {\n\t\t\treturn errors.New("application: incident callbacks require the production Telegram notifier")\n\t\t}\n\t\treturn nil\n\t}'''
          replacement = '''\tif !a.Config.Telegram.Enabled {\n\t\t// CallbackSecurity may exist independently as a cryptographic authority.\n\t\t// Without a production notifier we intentionally expose no incident\n\t\t// runtime and therefore no CallbackIngress.\n\t\treturn nil\n\t}'''
          if text.count(needle) != 1:
              raise SystemExit('Telegram-disabled runtime anchor mismatch')
          text = text.replace(needle, replacement)

          needle = '''\troot := filepath.Join(filepath.Dir(a.Config.Database.Path), "orchestration", "incident")\n\tconfig := orchestrationincident.DefaultConfig(root)'''
          replacement = '''\troot := incidentRuntimeRoot(a.Config.Database.Path)\n\tconfig := orchestrationincident.DefaultConfig(root)'''
          if text.count(needle) != 1:
              raise SystemExit('Incident root anchor mismatch')
          text = text.replace(needle, replacement)
          runtime.write_text(text)

          runtime_test = Path('internal/app/incident_runtime_test.go')
          text = runtime_test.read_text()
          needle = '''\tcfg.Security.Callbacks.Enabled = true\n\ta = &App{Config: cfg}\n\tif err := a.startIncidentRuntime(); err == nil {\n\t\tt.Fatal("callback authority enabled without production notifier")\n\t}\n}'''
          replacement = '''\tcfg.Security.Callbacks.Enabled = true\n\ta = &App{Config: cfg}\n\tif err := a.startIncidentRuntime(); err != nil {\n\t\tt.Fatalf("callback security without a notifier should remain transport-inert: %v", err)\n\t}\n\tif a.IncidentRuntime != nil {\n\t\tt.Fatal("callback security alone created a production incident runtime")\n\t}\n}'''
          if text.count(needle) != 1:
              raise SystemExit('Runtime configuration test anchor mismatch')
          runtime_test.write_text(text.replace(needle, replacement))

          notifier_test = Path('internal/telegram/notifier_test.go')
          text = notifier_test.read_text()
          needle = '''\t// Give the second caller a deterministic opportunity to observe the durable\n\t// sending state before the first provider call completes.\n\ttime.Sleep(20 * time.Millisecond)\n\tclose(release)\n\tfirst := <-results\n\tsecond := <-results'''
          replacement = '''\t// The first provider call is blocked, so the first result available here\n\t// must come from the duplicate caller observing durable sending state.\n\tvar second outcome\n\tselect {\n\tcase second = <-results:\n\tcase <-time.After(time.Second):\n\t\tt.Fatal("duplicate caller did not converge while provider call was fenced")\n\t}\n\tif second.err != nil || second.result.State != gateway.EffectAmbiguous {\n\t\tt.Fatalf("duplicate caller result=%+v err=%v", second.result, second.err)\n\t}\n\tclose(release)\n\tfirst := <-results'''
          if text.count(needle) != 1:
              raise SystemExit('Notifier concurrency anchor mismatch')
          notifier_test.write_text(text.replace(needle, replacement))
      - name: Format
        run: gofmt -w internal/app/app.go internal/app/incident_runtime.go internal/app/incident_runtime_test.go internal/telegram/notifier_test.go
      - name: Target tests
        run: go test ./internal/app ./internal/telegram ./internal/orchestration/incident -count=1
      - name: Target race
        run: go test -race ./internal/app ./internal/telegram ./internal/orchestration/incident -count=1
      - name: Commit verified patch and remove bootstrap
        run: |
          set -euo pipefail
          rm .github/workflows/stage17-runtime-wire-bootstrap.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/app/app.go internal/app/incident_runtime.go internal/app/incident_runtime_test.go internal/telegram/notifier_test.go .github/workflows/stage17-runtime-wire-bootstrap.yml
          git commit -m "feat(stage17): wire production incident runtime"
          git push origin HEAD:stage17-incident-runtime-wiring
