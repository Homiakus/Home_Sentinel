name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Module hygiene
        run: |
          go mod download
          go mod verify
          go list ./... >/dev/null
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format check
        run: |
          files="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          test -z "$files" || (echo "$files" && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -count=1

      - name: Race tests
        run: go test -race ./... -count=1

      - name: Engineering-loop reconciliation
        run: go run ./cmd/sentinel-engloop reconcile --root . --strict

      - name: Benchmark smoke
        run: |
          go test ./internal/policy/risk -run '^$' -bench BenchmarkAssess -benchtime=25x
          go test ./internal/correlation -run '^$' -bench BenchmarkCorrelatorIngest -benchtime=25x
