name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          # go.sum is not committed yet; enabling setup-go cache before the
          # module lock exists can fail before `go mod download` gets a chance
          # to materialize it. Stage 14 turns caching back on with go.sum.
          cache: false

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify
          go list ./... >/dev/null

      - name: Format check
        run: |
          files="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          test -z "$files" || (echo "$files" && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -count=1

      - name: Race tests
        run: go test -race ./... -count=1

      - name: Benchmark smoke
        run: |
          go test ./internal/policy/risk -run '^$' -bench BenchmarkAssess -benchtime=25x
          go test ./internal/correlation -run '^$' -bench BenchmarkCorrelatorIngest -benchtime=25x
