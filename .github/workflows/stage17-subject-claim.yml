name: stage17-subject-claim

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage17-subject-claim.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Add signed callback subject claim
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/security/callback/token.go')
          text = path.read_text()
          old = '\tEventID     string `json:"eventId"`\n'
          new = old + '\tSubject     string `json:"subject,omitempty"`\n'
          if old not in text:
              raise SystemExit('callback claims EventID anchor not found')
          if 'json:"subject,omitempty"' not in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          gofmt -w internal/security/callback/token.go
          go test ./internal/security/callback
          go test -race ./internal/security/callback
      - name: Commit verified claim and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/stage17-subject-claim.yml
          git add internal/security/callback/token.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security(callback): bind signed subject identity"
          git push origin HEAD:main
